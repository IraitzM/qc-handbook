<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <!-- abstraction axis -->
  <defs>
    <marker id="arrowup" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 7 L 4 0 L 8 7 z" fill="#78909c"/>
    </marker>
    <marker id="arrowdown" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M 0 1 L 4 8 L 8 1 z" fill="#78909c"/>
    </marker>
  </defs>
  <line x1="26" y1="392" x2="26" y2="34" stroke="#78909c" stroke-width="1.5" marker-end="url(#arrowup)"/>
  <text x="18" y="215" fill="#546e7a" font-size="12" text-anchor="middle" transform="rotate(-90 18 215)">more abstraction</text>

  <!-- Agents -->
  <rect x="48" y="30" width="470" height="66" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="66" y="54" font-size="15" font-weight="bold" fill="#4527a0">Agents</text>
  <text x="66" y="72" font-size="12" fill="#4527a0">abstraction: from a problem statement to a formulation</text>
  <text x="66" y="88" font-size="11" fill="#6a5b8c">LLM assistants, MCP servers, agent frameworks, tool calling</text>

  <!-- Software -->
  <rect x="48" y="104" width="470" height="66" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="66" y="128" font-size="15" font-weight="bold" fill="#0d47a1">Software (SDKs)</text>
  <text x="66" y="146" font-size="12" fill="#0d47a1">definition and reproducibility: the circuit as an artifact</text>
  <text x="66" y="162" font-size="11" fill="#4a6f96">Python + Qiskit, PennyLane, Cirq, Ocean, Braket, QuTiP, OpenQASM 3, QIR</text>

  <!-- Compilers -->
  <rect x="48" y="178" width="470" height="66" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="66" y="202" font-size="15" font-weight="bold" fill="#1b5e20">Compilers and transpilers</text>
  <text x="66" y="220" font-size="12" fill="#1b5e20">optimization: fewer, better placed and cheaper operations</text>
  <text x="66" y="236" font-size="11" fill="#4a7a4e">Qiskit passes, pytket (TKET), ZX-calculus (PyZX), BQSKit, Superstaq</text>

  <!-- Runtime -->
  <rect x="48" y="252" width="470" height="66" rx="8" fill="#fff8e1" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="66" y="276" font-size="15" font-weight="bold" fill="#e65100">Runtime and access</text>
  <text x="66" y="294" font-size="12" fill="#e65100">execution: queues, sessions and the hybrid loop</text>
  <text x="66" y="310" font-size="11" fill="#96702e">Qiskit Runtime, Braket Hybrid Jobs, Azure Quantum, CUDA-Q, qBraid</text>

  <!-- Hardware -->
  <rect x="48" y="326" width="470" height="66" rx="8" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
  <text x="66" y="350" font-size="15" font-weight="bold" fill="#880e4f">Hardware (QPU)</text>
  <text x="66" y="368" font-size="12" fill="#880e4f">quality: coherence, fidelity and how many qubits actually work</text>
  <text x="66" y="384" font-size="11" fill="#9c5675">superconducting, ion traps, neutral atoms, photonics, spin, annealers</text>

  <line x1="26" y1="34" x2="26" y2="392" stroke="none"/>

  <!-- cross-cutting simulation column -->
  <rect x="540" y="104" width="196" height="288" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="638" y="152" font-size="14" font-weight="bold" fill="#37474f" text-anchor="middle">Simulation</text>
  <text x="638" y="172" font-size="14" font-weight="bold" fill="#37474f" text-anchor="middle">and emulation</text>
  <text x="638" y="200" font-size="12" fill="#37474f" text-anchor="middle">ground truth</text>
  <text x="638" y="216" font-size="12" fill="#37474f" text-anchor="middle">and baseline</text>
  <text x="638" y="248" font-size="11" fill="#546e7a" text-anchor="middle">state vector</text>
  <text x="638" y="266" font-size="11" fill="#546e7a" text-anchor="middle">density matrix</text>
  <text x="638" y="284" font-size="11" fill="#546e7a" text-anchor="middle">tensor networks (MPS)</text>
  <text x="638" y="302" font-size="11" fill="#546e7a" text-anchor="middle">stabilizer / Clifford</text>
  <text x="638" y="326" font-size="11" fill="#546e7a" text-anchor="middle">Aer, quimb, cuQuantum,</text>
  <text x="638" y="344" font-size="11" fill="#546e7a" text-anchor="middle">Stim, Quantum TEA</text>

  <line x1="518" y1="137" x2="540" y2="137" stroke="#607d8b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="518" y1="211" x2="540" y2="211" stroke="#607d8b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="518" y1="285" x2="540" y2="285" stroke="#607d8b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="518" y1="359" x2="540" y2="359" stroke="#607d8b" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="283" y="424" font-size="12" fill="#546e7a" text-anchor="middle">every layer only helps if the one below it is trustworthy</text>
</svg>
